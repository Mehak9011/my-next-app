<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="CBD e-commerce — storefront placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2530"/>
      <stop offset="1" stop-color="#0F1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63329"/>
      <stop offset="1" stop-color="#EE3E3E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="56" y="56" width="150" height="10" rx="5" fill="url(#accent)"/>
  <text x="56" y="176" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">CBD E-Commerce</text>
  <text x="56" y="242" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9AA3AC">Storefront Placeholder</text>
</svg>